name: 收集 Prompt 或文档
description: 保存一个可复用的 Prompt、技术文档或方法
title: ""
labels:
  - prompt
body:
  - type: markdown
    attributes:
      value: |
        请在正文中粘贴完整内容，并补充必要的使用场景或备注。
  - type: textarea
    id: content
    attributes:
      label: 内容
      description: Prompt 或文档正文，支持 Markdown
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 使用说明（可选）
      description: 记录适用场景、变量、示例或注意事项
